note: >-
  Qargo documents an inbound and outbound webhook surface inside its OpenAPI (tags
  Webhooks/Inbound and Webhooks/Outbound). No standalone AsyncAPI document is published.
  Inbound webhooks are endpoints hosted by Qargo that integrators POST to; outbound
  webhooks are payloads Qargo POSTs to integrator-hosted endpoints. Webhooks authenticate
  with HTTP Basic (BasicAuthWebhookCredentials), provisioned by Qargo.
