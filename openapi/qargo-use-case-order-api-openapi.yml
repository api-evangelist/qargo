openapi: 3.2.0
info:
  title: Qargo TMS Use case / Order API
  description: For support, please contact integrations@qargo.com.
  version: 1.2.0
servers:
- url: https://api.qargo.com
tags:
- name: Use case / Order
  description: 'Required api role: `API_ORDER`


    All endpoints related to order creation and status retrieval/subscription.


    ### Getting started

    See this section to get started.


    ### Customer portal

    See Customer portal for the customer version.'
paths:
  /v1/webhook:
    post:
      tags:
      - Use case / Order
      summary: Create/Update/Cancel Orders
      description: 'Webhook for creating/updating and cancelling transport orders.


        This is the fully asynchronous version of the order upload api.

        The documented schema is our default input format, but we can also map custom formats.


        Note that this webhook uses Basic Auth instead of the OAuth credentials used for the api.

        Please contact integrations@qargo.com to request credentials.'
      operationId: order-import-webhook
      security:
      - BasicAuthWebhookCredentials: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/OrderInput'
              - type: string
                format: binary
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OrderImportResponse'
                - type: 'null'
                title: Response Order-Import-Webhook
        '400':
          description: Bad Request — invalid input or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials
        '403':
          description: Forbidden — insufficient permissions for this operation
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests — rate limit exceeded. See the `Retry-After` header
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable — temporarily unable to handle the request
  /v1/webhook/partial-order-update:
    post:
      tags:
      - Use case / Order
      summary: Partial Order Update
      description: Webhook for partial order updates. Push to the endpoint to update specific fields of an existing order.
      operationId: partial-order-update
      security:
      - BasicAuthWebhookCredentials: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdatePayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PartialOrderUpdateResponse'
                - type: 'null'
                title: Response Partial-Order-Update
        '400':
          description: Bad Request — invalid input or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials
        '403':
          description: Forbidden — insufficient permissions for this operation
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests — rate limit exceeded. See the `Retry-After` header
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable — temporarily unable to handle the request
