  /v1/webhook/document-import:
    post:
      tags:
      - Use case / Document import
      - Webhooks / Inbound
      summary: Generic Document Import
      description: 'Webhook for importing documents and attaching them to existing orders in Qargo.


        ## How it works


        1. An external system sends a file to this endpoint with metadata as query parameters.

        2. The system matches the document to an order in Qargo using the provided query parameters.

        3. The document is created and attached to the matched order.


        ## Query parameters


        The `filename` parameter is always required. Additional query parameters are **configurable

        per integration** during setup and are used to pass metadata about the file and to match

        the document to an order.


        Query parameters can carry two types of information:


        ### File metadata


        Information about the document itself, for example:

        - `filename` (required) — Name of the uploaded file including extension

        - `document_type` — The type of document, see the **Document types** section below

        - `document_name` — Display name for the document in Qargo


        ### Matching to Qargo orders


        Information used to resolve which order the document should be attached to.

        The following order fields can be matched against:


        - `customer_reference_number` — The customer reference number on the order

        - `name` — The order name (e.g. `OR-12345`)

        - `id` — The order UUID


        The match must resolve to **exactly one order**. If no order or multiple orders match,

        the import will be discarded.


        The actual set of query parameters and how they map to the above is configured per integration.


        ## Document types


        The `document_type` parameter must be one of the following values:


        | Document type |

        |---|

        | `ADDRESS_LABEL` |

        | `ANALYSIS_CERTIFICATE` |

        | `ANNEX_VII_WASTE_SHIPMENT` |

        | `APPROVAL_LOADING_LIST` |

        | `ATR` |

        | `AUTHORIZATION_PREFERENTIAL_ORIGIN` |

        | `BILL_OF_LADING_INSTRUCTIONS` |

        | `CATTLE_TRANSPORT_JOURNAL` |

        | `CERTIFICATE_OF_ORIGIN` |

        | `CERTIFICATE_OF_SHIPMENT` |

        | `CLAIM` |

        | `CMR_INSURANCE` |

        | `COMMERCIAL_INVOICE` |

        | `CONFIRMATION_TARIFF_SHIPPING_LINE` |

        | `CONSIGNEE_SIGNATURE` |

        | `CONSIGNOR_SIGNATURE` |

        | `CONTAINER_CLEANING_CERTIFICATE` |

        | `CUSTOMER_PAPERWORK` |

        | `CUSTOMS_DECLARATION_INSTRUCTIONS` |

        | `CUSTOMS_DOCUMENT` |

        | `CUSTOMS_INVOICE` |

        | `DANGEROUS_GOODS_DECLARATION` |

        | `DEFENSE_MUNITIONS_VEHICLE_STABLING_REQUEST_FORM` |

        | `DISPATCH_CONFIRMATION` |

        | `DRAFT_BILL_OF_LADING` |

        | `DRIVER_SIGNATURE` |

        | `DUTCH_CUSTOMS_RELEASE` |

        | `EQUIPMENT_INTERCHANGE_RECEIPT` |

        | `EUR1` |

        | `EUR_MED` |

        | `EXPORT_ACCOMPANYING_DOCUMENT` |

        | `EXPORT_DECLARATION` |

        | `EXPORT_DOCUMENT` |

        | `EXTRA_COST_CONFIRMATION` |

        | `EXTRA_PERMITTED_WEIGHT` |

        | `EX_A_EXPORT_DECLARATION` |

        | `FINAL_BILL_OF_LADING` |

        | `GOODS_IN` |

        | `GOODS_OUT` |

        | `GPS_TRACKER_REPORT` |

        | `IFP` |

        | `IMDG` |

        | `IMPORT_DECLARATION` |

        | `IMPORT_DOCUMENT` |

        | `IM_A` |

        | `INSURANCE_DOCUMENT` |

        | `LOCATION_INFO` |

        | `LUMPER_RECEIPT` |

        | `MANIFEST` |

        | `MULTIMODAL_DANGEROUS_GOODS_DECL` |

        | `ORDER_ACCEPTANCE` |

        | `ORDER_CONFIRMATION` |

        | `ORIGINAL_CMR` |

        | `OTHER_ADMINISTRATION` |

        | `PALLET_LABEL` |

        | `PALLET_LABEL_EXTERNAL` |

        | `PALLET_NOTE` |

        | `PHOTO_DAMAGED_GOODS` |

        | `PHOTO_OF_GOODS_DELIVERY` |

        | `PHOTO_OF_GOODS_PICKUP` |

        | `PHOTO_SEAL_NUMBER` |

        | `PICKUP_CMR` |

        | `PICKUP_NOTE` |

        | `PREFILLED_CMR` |

        | `PRICE_OFFER_CUSTOMER` |

        | `PROOF_OF_DELIVERY` |

        | `PROOF_OF_DELIVERY_DRIVER_APP` |

        | `PROOF_OF_DELIVERY_SIGNED` |

        | `PROOF_OF_PICKUP` |

        | `PROOF_OF_PICKUP_SIGNED` |

        | `QUOTE` |

        | `RECEIPT` |

        | `SAFETY_SECURITY_DECLARATION` |

        | `SECURITY_PLAN_FORM` |

        | `SINGLE_ADMINISTRATIVE_DOCUMENT` |

        | `STANDARD_OPERATING_PROCEDURE` |

        | `STICKER_LABEL` |

        | `T1_DOCUMENT` |

        | `T2_DOCUMENT` |

        | `TEMPERATURE_REPORT` |

        | `TIMESLOT_CONFIRMATION` |

        | `TRANSIT_DOCUMENT` |

        | `VGM_CONTAINER` |

        | `VISITOR_SAFETY_INSTRUCTION` |

        | `WAITING_HOURS_INFORMATION` |

        | `WASTE` |

        | `WAYBILL` |

        | `WEIGHING_TICKET` |


        ## Content encoding


        | Content format | Content-Type header | Behavior |

        |---|---|---|

        | Binary (e.g. PDF, image) | `application/pdf`, `image/png`, etc. | Passed through as-is |

        | Text | `text/plain`, `text/xml`, etc. | Encoded as UTF-8 bytes |

        | Base64-encoded string | Non-text or no header | Base64 decode attempted; raw string used on failure |


        Please provide the `Content-Type` header matching the file format.


        ## Error handling


        | Scenario | Behavior |

        |----------|----------|

        | No order matches the provided criteria | Import is discarded |

        | Multiple orders match the criteria | Import is discarded  |

        | Document metadata not provided | Import is discarded |'
      operationId: document-import-webhook
      security:
      - BasicAuthWebhookCredentials: []
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
          description: Name of the file being uploaded, including extension. This is used as the primary source for the file name in Qargo.
          title: Filename
        description: Name of the file being uploaded, including extension. This is used as the primary source for the file name in Qargo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: string
                format: binary
              - type: object
              - type: array
                items: {}
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
              description: The document content as binary file data or a JSON message.
              title: File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentImportResponse'
        '400':
          description: Bad Request — invalid input or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials
        '403':
          description: Forbidden — insufficient permissions for this operation
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests — rate limit exceeded. See the `Retry-After` header
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable — temporarily unable to handle the request
  /v1/webhook/fleet-document-upload:
    post:
      tags:
      - Use case / Fleet dispatch
      - Webhooks / Inbound
      - Use case / Document import
      summary: External Document Upload From A Fleet Application
      description: "Upload a document to a specific stop or stop group on a fleet-dispatched trip.\n\nThis webhook uses **Basic Auth** (webhook credentials), not the OAuth credentials used for the API.\nContact integrations@qargo.com to request credentials.\n\n---\n\n## Query parameters\n\n| Parameter | Required | Description |\n|-----------|----------|-------------|\n| `question_path_key` | Yes | Maps the file to a document type in Qargo (e.g. `CMR`, `POD`, `WEIGHT_NOTE`) |\n| `stop_id` | No* | The Qargo UUID of the stop to attach the document to |\n| `stop_group_id` | No* | The Qargo UUID of the stop group to attach the document to |\n\n*Provide either `stop_id` or `stop_group_id` to identify where to attach the document.\n\n## Headers\n\n| Header | Required | Description |\n|--------|----------|-------------|\n| `Content-Type` | Yes | MIME type of the file (e.g. `application/pdf`, `image/jpeg`) |\n| `Content-Disposition` | No | Provides the filename: `attachment; filename=\"POD.pdf\"` |\n\n## Filename handling\n\nThe uploaded file's name in Qargo is determined by:\n\n1. If `Content-Disposition` includes a `filename` — that value is used, combined with the question path key default.\n   For example: `filename=\"pod1234.pdf\"` with question path key default `POD.pdf` → stored as `pod1234_POD.pdf`.\n2. If no `Content-Disposition` is provided — the default filename from the question path key configuration is used.\n\n## Example\n\n```\ncurl -X POST \\\n  \"https://api.qargo.com/v1/webhook/fleet-document-upload\\\n  ?question_path_key=POD&stop_id=<stop_uuid>\" \\\n  -u \"<webhook_client_id>:<webhook_secret_id>\" \\\n  -H \"Content-Type: application/pdf\" \\\n  -H \"Content-Disposition: attachment; filename=POD.pdf\" \\\n  --data-binary @/path/to/document.pdf\n```"
      operationId: fleet-document-upload-webhook
      security:
      - BasicAuthWebhookCredentials: []
      parameters:
      - name: question_path_key
        in: query
        required: true
        schema:
          type: string
          description: 'The question path key to map the file in Qargo, for example: CMR/POD'
          title: Question Path Key
        description: 'The question path key to map the file in Qargo, for example: CMR/POD'
      - name: stop_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The stop ID to which the document is related
          title: Stop Id
        description: The stop ID to which the document is related
      - name: stop_group_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The stop group ID to which the document is related
          title: Stop Group Id
        description: The stop group ID to which the document is related
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: string
                format: binary
              - type: object
              - type: array
                items: {}
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
              description: A single binary file or JSON message
              title: File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request — invalid input or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials
        '403':
          description: Forbidden — insufficient permissions for this operation
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too Many Requests — rate limit exceeded. See the `Retry-After` header
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable — temporarily unable to handle the request
