      - oAuth2ClientCredentials: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pagination cursor. Mutually exclusive with other query parameters
          title: Cursor
        description: Pagination cursor. Mutually exclusive with other query parameters
      - name: archived
        in: query
        required: false
        schema:
          anyOf:
