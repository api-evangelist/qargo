            - `END_OF_MONTH_1`: End of next month

            - `END_OF_MONTH_0_NET_90`: End of this month, plus 90 days

            - `END_OF_MONTH_0_NET_75`: End of this month, plus 75 days

            - `END_OF_MONTH_0_NET_70`: End of this month, plus 70 days

            - `END_OF_MONTH_0_NET_65`: End of this month, plus 65 days

            - `END_OF_MONTH_0_NET_60`: End of this month, plus 60 days

            - `END_OF_MONTH_0_NET_50`: End of this month, plus 50 days

            - `END_OF_MONTH_0_NET_45`: End of this month, plus 45 days

            - `END_OF_MONTH_0_NET_35`: End of this month, plus 35 days

            - `END_OF_MONTH_0_NET_31`: End of this month, plus 31 days

            - `END_OF_MONTH_0_NET_30`: End of this month, plus 30 days

            - `END_OF_MONTH_0_NET_25`: End of this month, plus 25 days

            - `END_OF_MONTH_0_NET_21`: End of this month, plus 21 days

            - `END_OF_MONTH_0_NET_14`: End of this month, plus 14 days

            - `END_OF_MONTH_0_NET_7`: End of this month, plus 7 days

            - `END_OF_MONTH_0_NET_1`: End of this month, plus 1 day

            - `END_OF_MONTH_0`: End of month

            - `PREPAID`: Prepaid

            - `CUSTOM_DUE_DATE`: Custom due date, set on invoice creation. Not allowed to set via the API

            - `UPON_RECEIPT`: Upon receipt

            - `NET_1`: 1 day after receipt

            - `NET_2`: 2 days after receipt

            - `NET_3`: 3 days after receipt

            - `NET_5`: 5 days after receipt

            - `NET_7`: 7 days after receipt

            - `NET_8`: 8 days after receipt

            - `NET_10`: 10 days after receipt

            - `NET_12`: 12 days after receipt

            - `NET_14`: 14 days after receipt

            - `NET_15`: 15 days after receipt

            - `NET_20`: 20 days after receipt

            - `NET_21`: 21 days after receipt

            - `NET_28`: 28 days after receipt

            - `NET_30`: 30 days after receipt

            - `NET_35`: 35 days after receipt

            - `NET_40`: 40 days after receipt

            - `NET_42`: 42 days after receipt

            - `NET_45`: 45 days after receipt

            - `NET_48`: 48 days after receipt

            - `NET_49`: 49 days after receipt

            - `NET_50`: 50 days after receipt

            - `NET_52`: 52 days after receipt

            - `NET_55`: 55 days after receipt

            - `NET_56`: 56 days after receipt

            - `NET_60`: 60 days after receipt

            - `NET_63`: 63 days after receipt

