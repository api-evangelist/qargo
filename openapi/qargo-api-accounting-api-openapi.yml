components:
  schemas:
    CreditPolicyOutput:
      properties:
        limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Limit
          description: The limit for total amount that has been invoiced but not paid.
          examples:
          - 10000
      type: object
      title: CreditPolicyOutput
    ListCompanyOutput:
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        items:
          items:
            $ref: '#/components/schemas/CompanyDetailOutput'
          type: array
          title: Items
      type: object
      required:
      - items
      title: ListCompanyOutput
    SalesInvoiceOutput:
      properties:
        date:
          type: string
          format: date
          title: Date
          description: Invoicing date
          examples:
          - '2022-01-01'
        due_date:
          type: string
          format: date
          title: Due Date
          examples:
          - '2022-01-01'
        booking_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Booking Date
          description: booking date needs to be enabled else this will default to the date field
          examples:
          - '2021-12-22'
        currency:
          type: string
          title: Currency
          description: Currency code (ISO 4217).
          examples:
          - EUR
        customer_reference_numbers:
          items:
            type: string
          type: array
          title: Customer Reference Numbers
          description: PO numbers
          default: []
          examples:
          - - '12345'
        custom_fields:
          type: object
          title: Custom Fields
          default: {}
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Technical id within the Qargo system
        name:
          type: string
          title: Name
          description: Name of the invoice.
          examples:
          - Invoice-0001
        e_invoicing:
          anyOf:
          - $ref: '#/components/schemas/EInvoicingOutput'
          - type: 'null'
          description: E-invoicing registration metadata.
        exchange_rate:
          anyOf:
          - $ref: '#/components/schemas/ExchangeRate'
          - type: 'null'
        total_excl_tax:
          type: string
          title: Total Excl Tax
          examples:
          - '100'
        total_incl_tax:
          type: string
          title: Total Incl Tax
          examples:
          - '121'
        total_tax:
          type: string
          title: Total Tax
          examples:
          - '21'
        customer:
          $ref: '#/components/schemas/CompanySummaryOutput'
        line_items:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
          title: Line Items
        billing_entity:
          $ref: '#/components/schemas/BillingEntity'
          description: Billing entity linked to this invoice.
      type: object
      required:
      - date
      - due_date
      - currency
      - id
      - name
      - total_excl_tax
      - total_incl_tax
      - total_tax
      - customer
      - line_items
      - billing_entity
      title: SalesInvoiceOutput
    CustomerReference:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: The unique Qargo ID of the customer. Use this to distinguish between different customers sharing the same accounting code.
        accounting_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Accounting Code
          description: Accounting code that uniquely identifies the customer in the accounting system.
      type: object
      title: CustomerReference
    RefundStatus:
      type: string
      enum:
      - OPEN
      - REFUNDED
      title: RefundStatus
    LocationOutput:
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: Technical code for integrations/mapping logic; should be treated as stable once set.
          examples:
          - LOC123
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Human-readable label for a location in operational views.
          examples:
          - Main Office
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
          description: Identifier from an external (master data) system.
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: First address line of the location
          examples:
          - Gaston Crommenlaan 4
        address_second_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Address Second Line
          description: Second address line of the location
          examples:
          - ''
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: City of the location
          examples:
          - Ghent
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: State of the location
          examples:
          - ''
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Country code (ISO 3166-1 alpha-2) of the location
          examples:
          - BE
        postal_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Postal Code
          description: Postal code of the location
          examples:
          - '9050'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the location
          examples:
          - Qargo HQ
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Unique identifier of the location
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude of the location
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude of the location
      type: object
      title: LocationOutput
    SalesCreditNoteOutput:
      properties:
        date:
          type: string
          format: date
          title: Date
          description: Credit note date
          examples:
          - '2022-01-01'
        booking_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Booking Date
          description: booking date needs to be enabled else this will default to the date field
          examples:
          - '2021-12-22'
        currency:
          type: string
          title: Currency
          examples:
          - EUR
        custom_fields:
          type: object
          title: Custom Fields
          default: {}
        customer_reference_numbers:
          items:
            type: string
          type: array
          title: Customer Reference Numbers
          examples:
          - - '12345'
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Technical id within the Qargo system
        name:
          type: string
          title: Name
          examples:
          - Credit-Note-0001
        e_invoicing:
          anyOf:
          - $ref: '#/components/schemas/EInvoicingOutput'
          - type: 'null'
          description: E-invoicing registration metadata.
        exchange_rate:
          anyOf:
          - $ref: '#/components/schemas/ExchangeRate'
          - type: 'null'
        total_excl_tax:
          type: string
          title: Total Excl Tax
          examples:
          - '100'
        total_incl_tax:
          type: string
          title: Total Incl Tax
          examples:
          - '121'
        total_tax:
          type: string
          title: Total Tax
          examples:
          - '21'
        customer:
          $ref: '#/components/schemas/CompanySummaryOutput'
        line_items:
          items:
            $ref: '#/components/schemas/LineItem'
          type: array
          title: Line Items
        billing_entity:
          $ref: '#/components/schemas/BillingEntity'
          description: Billing entity linked to this credit note.
      type: object
      required:
      - date
      - currency
      - id
      - name
      - total_excl_tax
      - total_incl_tax
      - total_tax
      - customer
      - line_items
      - billing_entity
      title: SalesCreditNoteOutput
    SubjectType:
      type: string
      enum:
      - SALES_INVOICE
      - SALES_CREDIT_NOTE
      - PURCHASE_INVOICE
      - PURCHASE_CREDIT_NOTE
      title: SubjectType
    api__accounting__models__master_data__AccountOutput:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier of the record in Qargo.
        archived:
          type: boolean
          title: Archived
          description: Whether this record has been archived.
        code:
          type: string
          title: Code
          description: Accounting code (GL / nominal code).
        name:
          type: string
          title: Name
          description: Display name of the account.
        billing_entity:
          $ref: '#/components/schemas/BillingEntity'
          description: Billing entity this account belongs to.
      type: object
      required:
      - id
      - archived
      - code
      - name
      - billing_entity
      title: AccountOutput
    LineItem:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Unique id of this line item. A Qargo invoice line can be represented with multiple LineItems if revenue/cost split is enabled.
        invoice_line_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Invoice Line Id
          description: Technical id of the invoice within the Qargo system
        name:
          type: string
          title: Name
          description: Name of the charge line.
          examples:
          - Fuel charge
        amount:
          type: string
          title: Amount
          description: Amount of the charge line.
          examples:
          - '100'
        code:
          type: string
          title: Code
          description: Code of the type of charge line.
          examples:
          - FUEL
        account:
          anyOf:
          - $ref: '#/components/schemas/api__order__models__charge__AccountOutput'
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Freeform description field
          default: ''
          examples:
          - Charge description
        tax_rate:
          anyOf:
          - $ref: '#/components/schemas/api__accounting__models__invoice__TaxRate'
          - type: 'null'
        base_tax_rate:
          anyOf:
          - $ref: '#/components/schemas/BaseTaxRate'
          - type: 'null'
          description: Original tax rate before applying tax rules.
        order_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Name
          description: Linked Qargo order name, for cost charges.
          examples:
          - Order-0001
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Order Id
          description: Linked Qargo order id, for cost charges.
        trip_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Trip Id
          description: Linked Qargo trip id, for cost charges
        is_credit_charge:
          type: boolean
          title: Is Credit Charge
          default: false
          examples:
          - false
        invoice_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoice Name
          description: Name of the source invoice this line item is linked to, if applicable.
          examples:
          - Invoice-0001
        currency:
          type: string
          title: Currency
          examples:
          - USD
        fraction:
          type: string
          title: Fraction
          description: The api can split the charge lines according to revenue. This fraction indicates the percentage of the total amount of the split for this set of dimensions.
          default: '1'
          examples:
          - '0.5'
        dimension_1:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimension 1
