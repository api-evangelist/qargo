name: Qargo
description: >-
  Qargo is an intelligent transport management platform (TMS) for road carriers, freight
  forwarders and 3PLs, using AI to automate operational and administrative work across
  planning, execution, tracking and accounting. Qargo publishes a public Qargo TMS API
  (OpenAPI 3.1, v1.2.0, base https://api.qargo.com) exposing tenant-level integration and
  operational endpoints for orders, trips, companies, resources, documents, tasks and
  accounting, plus inbound and outbound webhooks and separate Subcontractor and Customer
  APIs. Service-to-service authentication uses OAuth2 client-credentials (JWT); webhooks
  use HTTP Basic. Qargo is a Balderton Capital portfolio company.
