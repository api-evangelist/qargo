  oauth2_flows:
  - clientCredentials
  note: >-
    The Qargo TMS REST API uses OAuth2 client-credentials (service-to-service). A JWT
    access token is obtained from POST https://api.qargo.com/v1/auth/token using HTTP
    Basic auth (client_id:secret_id, base64) and refreshed on expiry (expires_in).
    Application clients are created by a Super admin under Configuration -> Organisation
    Settings and must be linked to an approved integration id. Webhooks use a SEPARATE
    HTTP Basic scheme (BasicAuthWebhookCredentials), provisioned by Qargo — OAuth tokens
    must not be used for webhooks.
